[configuration]
name = "sample_workspace"
version = "0.1.0"
description = "Sample Solix project for interactive VS Code testing"
license = "Apache-2.0"
authors = ["Solix Team"]

[profiles.release]
entrypoint = "main"
optimization_level = 3
inline_threshold = 16
debug_symbols = false
static = true
sources = ["src"]

[profiles.debug]
inherits = "release"
optimization_level = 0
inline_threshold = 8
debug_symbols = true
static = false

[profiles.test]
inherits = "debug"
entrypoint = "test_addition"
sources = ["src", "tests"]
