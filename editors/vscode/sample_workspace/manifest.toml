[info]
name = "sample_workspace"
version = "0.1.0"
description = "Sample Solix project for interactive VS Code testing"
license = "Apache-2.0"
authors = ["Solix Team"]

[entrypoints]
main = "main"
test = "test_addition"

[build]
profile = "debug"

[profile.default]
opt_level = 0
inline_threshold = 8
debug_symbols = true

[profile.release]
inherits = "default"
opt_level = 3
debug_symbols = false

[dependencies]
