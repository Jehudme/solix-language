[workspace]
publish = true
git_tag_enable = false
git_release_enable = false
semver_check = false
changelog_config = "cliff.toml"
pr_name = "chore(release): release {{ version }}"
pr_body = "This automated PR was generated by release-plz to bump the workspace version and update CHANGELOG.md."

[[package]]
name = "solix-common"
version_group = "solix"

[[package]]
name = "solix-compilation"
version_group = "solix"

[[package]]
name = "solix-ffi"
version_group = "solix"
semver_check = true

[[package]]
name = "solix-runtime"
version_group = "solix"
git_tag_enable = true
git_tag_name = "v{{ version }}"
