# Configuration for cross-compiling solixlib native bridge across all platforms via cross-rs containers.

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:edge"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"

[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:edge"

# Apple Darwin targets (x86_64-apple-darwin, aarch64-apple-darwin) are compiled via
# native Xcode / Apple SDK on macOS runners (or a user-provided local osxcross image),
# because cross-rs does not distribute public macOS SDK containers on ghcr.io.
