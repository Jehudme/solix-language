[info]
name = "solix"
version = "2.0.0"
description = "Solix Standard Library"
license = "Apache-2.0"
authors = []

[entrypoints]
main = "Main::main"
test = "TestRunner::test"

[build]
profile = "release"

[profile.default]
opt_level = 0
inline_threshold = 8
debug_symbols = true

[profile.release]
inherits = "default"
opt_level = 3
inline_threshold = 16
debug_symbols = false

[dependencies]
# solix = { version = "2.0.0", profile = "release" }
