# Configuration for cross-compiling Raylib native bridge across all platforms via cross-rs containers.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install --assume-yes cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev"
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update && apt-get install --assume-yes cmake libgl1-mesa-dev:arm64 libx11-dev:arm64 libxcursor-dev:arm64 libxrandr-dev:arm64 libxinerama-dev:arm64 libxi-dev:arm64"
]

[target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu:edge"
pre-build = [
    "apt-get update && apt-get install --assume-yes cmake"
]

[target.x86_64-apple-darwin]
image = "solix/apple-darwin-cross:15.5-ubuntu"

[target.aarch64-apple-darwin]
image = "solix/apple-darwin-cross:15.5-ubuntu"

[build.env]
passthrough = [
    "SOLIX_NATIVE_BUILD",
    "OSXCROSS_HOST",
    "MACOSX_DEPLOYMENT_TARGET",
    "CMAKE_OSX_DEPLOYMENT_TARGET",
    "CMAKE_TOOLCHAIN_FILE_x86_64_apple_darwin",
    "CC_x86_64_apple_darwin",
    "CXX_x86_64_apple_darwin",
    "AR_x86_64_apple_darwin",
    "RANLIB_x86_64_apple_darwin",
    "CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER",
    "CARGO_TARGET_X86_64_APPLE_DARWIN_AR",
    "CMAKE_TOOLCHAIN_FILE_aarch64_apple_darwin",
    "CC_aarch64_apple_darwin",
    "CXX_aarch64_apple_darwin",
    "AR_aarch64_apple_darwin",
    "RANLIB_aarch64_apple_darwin",
    "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER",
    "CARGO_TARGET_AARCH64_APPLE_DARWIN_AR",
]
