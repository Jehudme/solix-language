[configuration]
name = "raylib"
version = "5.5.0"
description = "Solix Raylib 1-to-1 Complete Bindings"
license = "zlib/libpng"
authors = []

[profiles.release]
entrypoint = "Main::main"
optimization_level = 3
inline_threshold = 16
debug_symbols = false
static = true
sources = ["src"]

[profiles.debug]
inherits = "release"
optimization_level = 0
inline_threshold = 8
debug_symbols = true
static = false

[profiles.test]
inherits = "debug"
entrypoint = "TestRunner::test"
sources = ["src", "tests"]
