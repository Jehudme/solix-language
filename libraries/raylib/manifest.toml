[info]
name = "raylib"
version = "5.5.0"
description = "Solix Raylib 1-to-1 Complete Bindings"
license = "zlib/libpng"
authors = []

[entrypoints]
test = "TestRunner::test"

[build]
profile = "release"

[profile.default]
opt_level = 0
inline_threshold = 8
debug_symbols = true

[profile.release]
inherits = "default"
opt_level = 3
inline_threshold = 16
debug_symbols = false

