[configuration]
name = "untitled"
version = "0.1.0"
description = "An untitled Solix project with Rust native interoperability"
license = "Apache-2.0"
authors = ["Jehud Metellus"]
dynamic_libraries = ["rust_bridge"]

[profiles.release]
entrypoint = "Main::main"
optimization_level = 3
inline_threshold = 16
debug_symbols = false
static = true
platforms = ["all"]
sources = ["src"]

[profiles.release.dependencies]
solix = { version = "2.0.0", profile = "release" }

[profiles.debug]
inherits = "release"
optimization_level = 0
inline_threshold = 8
debug_symbols = true
static = false
platforms = ["host"]

[profiles.test]
inherits = "debug"
entrypoint = "TestRunner::test"
platforms = ["host"]
sources = ["tests"]
