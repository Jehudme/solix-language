# Multi-Platform Release Distribution for Solix Toolchain
# Builds and publishes across Windows, macOS (Intel & Apple Silicon), and Universal Linux (GNU & MUSL)

name: Release
permissions:
  contents: write

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Git tag (e.g. v1.3.1)"
        required: true
        default: "v1.3.1"

jobs:
  build-vscode-extension:
    name: Build & Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies and compile extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o solix-language.vsix

      - name: Upload VS Code Extension for release
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-vscode-extension
          path: editors/vscode/solix-language.vsix

  build-arm64-linux-bundled-libs:
    name: Build Bundled Libraries (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux ARM64 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Build host solix toolchain and native ARM64 libraries
        env:
          SOLIX_TARGET_TRIPLE: aarch64-unknown-linux-gnu
        run: |
          cargo build --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug

      - name: Upload ARM64 bundled packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundled-packages-aarch64-unknown-linux-gnu
          path: crates/solix-toolchain/assets/packages/

  benchmark-release:
    name: Run Benchmark Suite & Generate Release Notes Comparison
    runs-on: ubuntu-latest
    needs:
      - plan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Build optimized Solix release binary and stage default libraries
        run: |
          cargo build --release --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug --solix-binary target/release/solix

      - name: Execute benchmark suite and generate release baseline
        run: |
          mkdir -p staging-benchmarks
          python3 benchmarks/runner.py --save-baseline staging-benchmarks/release_baseline.json

      - name: Generate release notes comparison table against previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 benchmarks/compare_releases.py \
            --current staging-benchmarks/release_baseline.json \
            --download-previous \
            --current-tag "${{ needs.plan.outputs.tag }}" \
            --markdown-output staging-benchmarks/benchmark_comparison.md

      - name: Upload benchmark artifacts for release ingestion
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-benchmarks
          path: staging-benchmarks/

  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event.inputs.tag_name || github.ref_name }}
      tag-flag: ${{ format('--tag={0}', github.event.inputs.tag_name || github.ref_name) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh

      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        run: |
          dist host --steps=create "${{ format('--tag={0}', github.event.inputs.tag_name || github.ref_name) }}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
      - build-arm64-linux-bundled-libs
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ join(matrix.targets, ',') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dist
        run: ${{ matrix.install_dist.run }}

      - name: Set up Zig compiler
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.13.0"

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: pipx install cargo-zigbuild

      - name: Install musl-tools
        if: runner.os == 'Linux' && contains(matrix.targets, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux dependencies for bundled libraries
        if: runner.os == 'Linux' && !contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS dependencies for bundled libraries
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Install dist target packages
        run: |
          ${{ matrix.packages_install }}

      - name: Download ARM64 bundled packages artifact
        if: contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        uses: actions/download-artifact@v8
        with:
          name: bundled-packages-aarch64-unknown-linux-gnu
          path: crates/solix-toolchain/assets/packages/

      - name: Build host-target bundled libraries natively
        if: ${{ !contains(matrix.targets, 'aarch64-unknown-linux-gnu') }}
        shell: bash
        run: |
          TARGET_TRIPLE="${{ join(matrix.targets, ',') }}"
          if [ "$TARGET_TRIPLE" = "x86_64-unknown-linux-musl" ]; then
            export SOLIX_TARGET_TRIPLE="x86_64-unknown-linux-gnu"
          else
            export SOLIX_TARGET_TRIPLE="$TARGET_TRIPLE"
          fi
          cargo build --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug

      - name: Stage non-colliding standalone bundled archives (Linux x86_64)
        if: contains(matrix.targets, 'x86_64-unknown-linux-gnu')
        shell: bash
        run: |
          mkdir -p target/distrib
          for dir in crates/solix-toolchain/assets/packages/*@*; do
            dir_name=$(basename "$dir")
            pkg_id="${dir_name%%@*}"
            for arc in "$dir"/*.slxarc; do
              cp "$arc" "target/distrib/${pkg_id}.slxarc"
            done
          done

      - name: Build artifacts
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          mkdir -p "$(dirname "$BUILD_MANIFEST_NAME")"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.slxarc

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    needs:
      - plan
      - build-vscode-extension
      - build-local-artifacts
      - build-global-artifacts
      - benchmark-release
    if: ${{ always() && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') && needs.build-vscode-extension.result == 'success' && needs.benchmark-release.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Finalize GitHub Release notes and extra assets
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG_NAME: "${{ needs.plan.outputs.tag }}"
        run: |
          rm -f artifacts/*-dist-manifest.json
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/benchmark_comparison.md ]; then
            printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            cat artifacts/benchmark_comparison.md >> "$RUNNER_TEMP/notes.txt"
            rm -f artifacts/benchmark_comparison.md
          fi
          mapfile -t release_files < <(find artifacts -maxdepth 1 -type f | sort)
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            if [ "${#release_files[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${release_files[@]}" --clobber
            fi
          else
            gh release create "$TAG_NAME" --target "$RELEASE_COMMIT" ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${release_files[@]}"
          fi
