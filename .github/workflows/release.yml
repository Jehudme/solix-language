# Multi-Platform Release Distribution for Solix Toolchain
# Builds and publishes across Windows, macOS (Intel & Apple Silicon), and Universal Linux (GNU & MUSL)

name: Release

permissions:
  contents: read

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Git tag (e.g. v1.5.0)"
        required: true
        default: "v1.5.0"

jobs:
  build-vscode-extension:
    name: Build & Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies and compile extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o solix-language.vsix

      - name: Upload VS Code Extension for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-vscode-extension
          path: editors/vscode/solix-language.vsix

  build-bundled-libs:
    name: Build Bundled Libraries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Build host solix toolchain and native libraries for ${{ matrix.target }}
        shell: bash
        env:
          SOLIX_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          cargo build --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug

      - name: Upload bundled packages artifact (${{ matrix.target }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled-packages-${{ matrix.target }}
          path: crates/solix-toolchain/assets/packages/

  merge-universal-bundled-packages:
    name: Merge Universal Cross-Platform Bundled Libraries
    needs:
      - build-bundled-libs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Download per-target bundled packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bundled-packages-*
          path: staging-bundled-libs

      - name: Merge per-platform libraries into universal cross-platform archives
        run: |
          python3 scripts/merge_bundled_packages.py \
            --input-dirs staging-bundled-libs/bundled-packages-* \
            --output-dir crates/solix-toolchain/assets/packages \
            --require-targets x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Upload universal cross-platform bundled packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

  benchmark-release:
    name: Run Benchmark Suite & Generate Release Notes Comparison
    runs-on: ubuntu-latest
    needs:
      - plan
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Build optimized Solix release binary and stage default libraries
        run: |
          cargo build --release --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug --solix-binary target/release/solix

      - name: Execute benchmark suite and generate release baseline
        run: |
          mkdir -p staging-benchmarks
          python3 benchmarks/runner.py --save-baseline staging-benchmarks/release_baseline.json

      - name: Generate release notes comparison table against previous release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          python3 benchmarks/compare_releases.py \
            --current staging-benchmarks/release_baseline.json \
            --download-previous \
            --current-tag "$CURRENT_TAG" \
            --markdown-output staging-benchmarks/benchmark_comparison.md

      - name: Upload benchmark artifacts for release ingestion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-benchmarks
          path: staging-benchmarks/

  plan:
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.event.inputs.tag_name || github.ref_name }}
      tag-flag: ${{ format('--tag={0}', github.event.inputs.tag_name || github.ref_name) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh

      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        env:
          TAG_VALUE: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          dist host --steps=create "--tag=${TAG_VALUE}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
      - merge-universal-bundled-packages
      - build-vscode-extension
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ join(matrix.targets, ',') }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dist
        if: runner.os != 'Windows'
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: eval "$INSTALL_DIST_CMD"

      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: Invoke-Expression $env:INSTALL_DIST_CMD

      - name: Set up Zig compiler
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.13.0"
          use-cache: false

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: pipx install cargo-zigbuild

      - name: Install musl-tools
        if: runner.os == 'Linux' && contains(matrix.targets, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux dependencies for bundled libraries
        if: runner.os == 'Linux' && !contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS dependencies for bundled libraries
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Install dist target packages
        if: runner.os != 'Windows'
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: eval "$PKG_INSTALL_CMD"

      - name: Install dist target packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PKG_INSTALL_CMD)) {
            Invoke-Expression $env:PKG_INSTALL_CMD
          }

      - name: Download universal cross-platform bundled packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

      - name: Stage non-colliding standalone bundled archives (Linux x86_64)
        if: contains(matrix.targets, 'x86_64-unknown-linux-gnu')
        shell: bash
        run: |
          mkdir -p target/distrib
          for dir in crates/solix-toolchain/assets/packages/*@*; do
            dir_name=$(basename "$dir")
            pkg_id="${dir_name%%@*}"
            for arc in "$dir"/*.slxarc; do
              cp "$arc" "target/distrib/${pkg_id}.slxarc"
            done
          done

      - name: Download bundled VS Code extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-vscode-extension
          path: crates/solix-toolchain/assets/vscode/

      - name: Stage versioned offline solix wiki documentation portal
        shell: bash
        run: python3 scripts/build_docs_site.py

      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          read -r -a dist_args_array <<< "$DIST_ARGS"
          dist build "$TAG_FLAG" --print=linkage --output-format=json "${dist_args_array[@]}" > dist-manifest.json
          echo "dist ran successfully"

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          mkdir -p "$(dirname "$BUILD_MANIFEST_NAME")"
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.slxarc

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build "$TAG_FLAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    needs:
      - plan
      - build-vscode-extension
      - merge-universal-bundled-packages
      - build-local-artifacts
      - build-global-artifacts
      - benchmark-release
    if: ${{ always() && needs.merge-universal-bundled-packages.result == 'success' && needs.build-local-artifacts.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && needs.build-vscode-extension.result == 'success' && needs.benchmark-release.result == 'success' }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist host "$TAG_FLAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Finalize GitHub Release notes and extra assets
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
          TAG_NAME: "${{ needs.plan.outputs.tag }}"
        run: |
          rm -f artifacts/*-dist-manifest.json
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/benchmark_comparison.md ]; then
            printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            cat artifacts/benchmark_comparison.md >> "$RUNNER_TEMP/notes.txt"
            rm -f artifacts/benchmark_comparison.md
          fi
          mapfile -t release_files < <(find artifacts -maxdepth 1 -type f | sort)
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            if [ "${#release_files[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${release_files[@]}" --clobber
            fi
          else
            gh release create "$TAG_NAME" --target "$RELEASE_COMMIT" ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${release_files[@]}"
          fi

  sync-wiki:
    name: Mirror Versioned Docs to GitHub Wiki
    needs:
      - plan
      - host
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Stage and push read-only GitHub Wiki snapshot
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          VERSION_CLEAN="${RELEASE_TAG#v}"
          WIKI_DIR="$RUNNER_TEMP/github_wiki"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" clone "https://github.com/${REPO_SLUG}.wiki.git" "$WIKI_DIR"; then
            echo "GitHub Wiki git remote is not initialized yet; skipping wiki mirror."
            exit 0
          fi
          python3 scripts/sync_github_wiki.py --output "$WIKI_DIR" --version "$VERSION_CLEAN"
          cd "$WIKI_DIR"
          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(wiki): sync documentation for Solix ${RELEASE_TAG}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD
          fi
