# Unified On-Demand Release Pipeline for Solix Toolchain & Workspace Crates
# Handles version selection, post-bump verification, dev -> master promotion,
# crates.io publishing, cross-platform installers, bundled packages,
# same-host release benchmarks, GitHub Releases, and Wiki/dev sync.

name: Release

run-name: "Release | ${{ inputs.version || inputs.bump || 'auto' }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

permissions:
  contents: read

env:
  SOLIX_RELEASE_CHANNEL: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump strategy (auto from Conventional Commits, patch, minor, or major)"
        type: choice
        required: true
        default: "auto"
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: "Optional exact SemVer override X.Y.Z (overrides bump choice)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Validate full release workflow without pushing master, tagging, or publishing"
        type: boolean
        required: false
        default: false

jobs:
  prepare-release:
    name: Prepare Release, Verify Bump & Promote master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.promote.outputs.release_sha }}
      tag: ${{ steps.bump.outputs.tag }}
      dist_tag: ${{ steps.bump.outputs.dist_tag }}
      version: ${{ steps.bump.outputs.version }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
      dry_run: ${{ inputs.dry_run }}
    steps:
      - name: Checkout integration trunk (dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust, Cargo cache, Python, and bundled package cache
        id: setup
        uses: ./.github/actions/solix-setup
        with:
          rust-cache-shared-key: ci-linux
          restore-bundled-libs: "true"
          bundled-libs-key-prefix: solix-bundled

      - name: Verify dev HEAD passed CI status checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          repo_name = os.environ["REPO_NAME"]
          dry_run = os.environ["DRY_RUN"].lower() == "true"
          required = [
              "Lint, Formatting & Documentation Gate",
              "Security & Supply-Chain Audit",
              "Test Matrix (ubuntu-latest)",
              "Test Matrix (macos-latest)",
              "Test Matrix (windows-latest)",
          ]

          recent_commits = (
              subprocess.check_output(
                  ["git", "rev-list", "-n", "10", "origin/dev"],
                  text=True,
              )
              .strip()
              .splitlines()
          )
          target_sha = recent_commits[0]
          for candidate_sha in recent_commits:
              subject = subprocess.check_output(
                  ["git", "log", "-1", "--format=%s", candidate_sha],
                  text=True,
              ).strip()
              if "[skip ci]" not in subject.lower():
                  target_sha = candidate_sha
                  break

          def fetch_check_runs_map(commit_sha: str) -> dict[str, dict]:
              raw_json = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{repo_name}/commits/{commit_sha}/check-runs"],
                  text=True,
              )
              payload = json.loads(raw_json)
              runs_by_name: dict[str, dict] = {}
              for item in payload.get("check_runs", []):
                  check_name = item.get("name", "")
                  if check_name not in runs_by_name or item.get("conclusion") == "success":
                      runs_by_name[check_name] = item
              return runs_by_name

          verified_sha = target_sha
          runs = fetch_check_runs_map(target_sha)
          if not all(
              runs.get(req, {}).get("status") == "completed"
              and runs.get(req, {}).get("conclusion") == "success"
              for req in required
          ):
              pulls_raw = subprocess.check_output(
                  ["gh", "api", f"repos/{repo_name}/commits/{target_sha}/pulls"],
                  text=True,
              )
              pulls = json.loads(pulls_raw)
              for pull in pulls:
                  pr_head_sha = (pull.get("head") or {}).get("sha")
                  if pr_head_sha:
                      pr_runs = fetch_check_runs_map(pr_head_sha)
                      if pr_runs:
                          runs = pr_runs
                          verified_sha = f"{pr_head_sha} (PR #{pull.get('number')} merged as {target_sha[:7]})"
                          break

          missing_or_failed = []
          for req in required:
              check = runs.get(req)
              if not check or check.get("status") != "completed" or check.get("conclusion") != "success":
                  status_desc = check.get("conclusion") or check.get("status") if check else "missing"
                  missing_or_failed.append(f"{req} ({status_desc})")

          if missing_or_failed:
              msg = f"origin/dev ({verified_sha}) has incomplete/failing CI checks: " + ", ".join(missing_or_failed)
              if dry_run:
                  print(f"::warning::{msg}")
              else:
                  print(f"::error::{msg}", file=sys.stderr)
                  sys.exit(1)
          else:
              print(f"All required CI checks passed for origin/dev ({verified_sha}).")
          PY

      - id: bump
        name: Compute and apply version bump & changelog
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch origin master dev
          AHEAD_COUNT=$(git rev-list --count origin/master..origin/dev)
          if [ "$AHEAD_COUNT" -eq 0 ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Integration branch dev has zero commits ahead of master." >&2
            exit 1
          fi

          OVERRIDE="$INPUT_BUMP"
          if [ -n "$INPUT_VERSION" ]; then
            OVERRIDE="$INPUT_VERSION"
          fi

          mkdir -p staging-release-notes
          python3 scripts/release/prepare_release_train.py \
            --base-ref origin/master \
            --head-ref origin/dev \
            --override "$OVERRIDE" \
            --write \
            --json-out "$RUNNER_TEMP/release_meta.json" \
            --changelog-out staging-release-notes/release_changelog.md

          CURRENT_VER=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/release_meta.json"))["current_version"])')
          NEXT_VER=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/release_meta.json"))["next_version"])')
          PREV_TAG="v${CURRENT_VER}"

          if [ "$DRY_RUN" = "true" ]; then
            DIST_TAG="v${CURRENT_VER}"
          else
            DIST_TAG="v${NEXT_VER}"
          fi

          {
            echo "current_version=${CURRENT_VER}"
            echo "version=${NEXT_VER}"
            echo "tag=v${NEXT_VER}"
            echo "dist_tag=${DIST_TAG}"
            echo "previous_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies for post-bump check
        if: steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev gcc

      - name: Install cross runner for post-bump check
        if: steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi

      - name: Build offline docs portal and share artifact
        run: python3 scripts/docs/build_docs_site.py

      - name: Upload staged offline solix wiki portal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/
          retention-days: 1

      - name: Run post-bump workspace verification and packaging dry-run
        env:
          BUNDLED_CACHE_HIT: ${{ steps.setup.outputs.bundled-libs-cache-hit }}
          # Tag vX.Y.Z is not pushed until the next step, so generated template tests
          # must point at `dev` during this pre-tag verification step.
          SOLIX_FFI_GIT_TAG: dev
          NEXT_VER: ${{ steps.bump.outputs.version }}
        run: |
          cargo build --bin solix
          if [ "$BUNDLED_CACHE_HIT" != "true" ]; then
            python3 scripts/release/build_default_libraries.py --target host --solix-binary target/debug/solix
            cargo build --bin solix
          fi
          SOLIX_BIN="$(pwd)/target/debug/solix"
          export SOLIX_BIN
          cargo test --workspace --locked
          python3 - "$NEXT_VER" <<'PY'
          import json
          import subprocess
          import sys

          expected_version = sys.argv[1]
          meta = json.loads(
              subprocess.check_output(
                  ["cargo", "metadata", "--no-deps", "--format-version", "1"],
                  text=True,
              )
          )
          versions = {pkg["name"]: pkg["version"] for pkg in meta["packages"]}
          for crate_name in ("solix-common", "solix-ffi", "solix-compilation", "solix-runtime"):
              actual_version = versions.get(crate_name)
              if actual_version != expected_version:
                  raise SystemExit(
                      f"ERROR: crate '{crate_name}' version '{actual_version}' != release target '{expected_version}'"
                  )
              print(f"Verified release version parity: {crate_name} == {actual_version}")
          PY
          cargo package -p solix-common --locked --allow-dirty
          cargo package -p solix-ffi --locked --allow-dirty
          git checkout -- crates/solix-toolchain/assets/docs 2>/dev/null || true

      - id: promote # zizmor: ignore[use-trusted-publishing]
        name: Promote dev to master, tag release, and publish crates
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          NEXT_VER: ${{ steps.bump.outputs.version }}
          TAG_NAME: ${{ steps.bump.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            RELEASE_SHA=$(git rev-parse origin/dev)
            echo "DRY RUN: verified bump v${NEXT_VER}, post-bump workspace tests, and crate packaging."
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md crates/*/CHANGELOG.md ffi/rust/Cargo.toml ffi/rust/CHANGELOG.md ffi/c/CHANGELOG.md ffi/c/CMakeLists.txt ffi/c/include/solix_ffi.h libraries/*/manifest.yaml libraries/*/CHANGELOG.md examples/*/manifest.yaml examples/*/CHANGELOG.md crates/solix-toolchain/assets/packages editors/vscode/package.json editors/vscode/package-lock.json crates/solix-toolchain/assets/vscode/solix-language.vsix
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): release ${NEXT_VER}"
          fi
          git tag -a "$TAG_NAME" -m "Solix ${TAG_NAME}"

          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin "HEAD:refs/heads/master" "refs/tags/${TAG_NAME}"

          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

          cargo publish -p solix-common --locked
          cargo publish -p solix-ffi --locked

          echo "Waiting for crates.io index to serve solix-common ${NEXT_VER}..."
          for attempt in $(seq 1 12); do
            echo "Checking crates.io index (attempt ${attempt}/12)..."
            if cargo search solix-common --limit 1 | grep -q "solix-common = \"${NEXT_VER}\""; then
              break
            fi
            sleep 10
          done

          cargo publish -p solix-compilation --locked
          cargo publish -p solix-runtime --locked

      - name: Upload release changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-release-notes
          path: staging-release-notes/release_changelog.md

  build-vscode-extension:
    name: Build & Package VS Code Extension
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js environment
        uses: ./.github/actions/solix-setup
        with:
          enable-rust: "false"
          enable-rust-cache: "false"
          enable-python: "false"
          enable-node: "true"

      - name: Install dependencies and compile extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npm run package

      - name: Upload VS Code Extension for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-vscode-extension
          path: editors/vscode/build/solix-language.vsix

  build-bundled-libs:
    name: Build Universal Bundled Libraries (Docker Containerized)
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Restore cached bundled first-party libraries
        id: bundled-libs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/solix-toolchain/assets/packages
          key: solix-bundled-release-universal-${{ hashFiles('libraries/**', 'crates/solix-common/src/**', 'crates/solix-compilation/src/**', 'crates/solix-toolchain/assets/scripts/**', 'scripts/release/build_default_libraries.py') }}

      - name: Install Rust toolchain
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Cargo dependencies
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-libs-universal

      - name: Set up Python environment
        uses: ./.github/actions/solix-setup
        with:
          enable-rust: "false"
          enable-rust-cache: "false"

      - name: Install cross runner and host prerequisites
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
          fi

      - name: Build universal bundled packages across all 5 desktop targets
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo build --release --bin solix
          python3 scripts/release/build_default_libraries.py --profiles release --no-install --solix-binary target/release/solix

      - name: Verify universal cross-platform binaries in bundled archives
        run: |
          python3 - <<'PY'
          import pathlib
          import zipfile

          required_triples = (
              "x86_64-unknown-linux-gnu",
              "aarch64-unknown-linux-gnu",
              "x86_64-pc-windows-gnu",
              "x86_64-apple-darwin",
              "aarch64-apple-darwin",
          )
          archives = sorted(pathlib.Path("crates/solix-toolchain/assets/packages").glob("*/*.slxarc"))
          if not archives:
              raise SystemExit("ERROR: no .slxarc archives found in crates/solix-toolchain/assets/packages")
          for archive_path in archives:
              with zipfile.ZipFile(archive_path) as archive:
                  names = archive.namelist()
              if archive_path.parent.name.startswith("raylib-"):
                  for triple in required_triples:
                      prefix = f"bin/{triple}/"
                      if not any(name.startswith(prefix) and not name.endswith("/") for name in names):
                          raise SystemExit(f"ERROR: {archive_path} missing native binary under {prefix}")
              print(f"Verified universal archive: {archive_path} ({len(names)} entries)")
          PY

      - name: Upload universal cross-platform bundled packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

  plan:
    name: Plan Multi-Platform Distribution
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      dist-tag: ${{ needs.prepare-release.outputs.dist_tag }}
      tag-flag: ${{ format('--tag={0}', needs.prepare-release.outputs.dist_tag) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Restore cached cargo-dist binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/dist
          key: cargo-dist-0.28.0-linux-x64

      - name: Install dist
        shell: bash
        run: |
          if [ ! -x ~/.cargo/bin/dist ]; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
          fi

      - name: Share dist binary with downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        env:
          TAG_VALUE: ${{ needs.prepare-release.outputs.dist_tag }}
        run: |
          dist host --steps=create "--tag=${TAG_VALUE}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  benchmark-release:
    name: Run Same-Host Release Benchmarks
    needs:
      - prepare-release
      - plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust, Cargo cache, Python, and bundled package cache
        id: setup
        uses: ./.github/actions/solix-setup
        with:
          rust-cache-prefix-key: release-bench
          restore-bundled-libs: "true"
          bundled-libs-key-prefix: solix-bundled-release

      - name: Download staged offline solix wiki portal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Install cross runner for release benchmark
        if: steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          rustup component add rust-src
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi

      - name: Build optimized Solix release binary and stage default libraries
        env:
          BUNDLED_CACHE_HIT: ${{ steps.setup.outputs.bundled-libs-cache-hit }}
        run: |
          cargo build --release --bin solix
          if [ "$BUNDLED_CACHE_HIT" != "true" ]; then
            python3 scripts/release/build_default_libraries.py --profiles release --target host --solix-binary target/release/solix
            cargo build --release --bin solix
          fi

      - name: Run same-host A/B benchmark suite against previous release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare-release.outputs.tag }}
          DRY_RUN: ${{ needs.prepare-release.outputs.dry_run }}
        run: |
          mkdir -p staging-benchmarks "$RUNNER_TEMP/prev_release"
          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName --jq "[.[] | select(.tagName != \"${CURRENT_TAG}\")][0].tagName // empty")
          PREV_BIN=""

          if [ -n "$PREV_TAG" ]; then
            echo "Downloading previous release Linux binary (${PREV_TAG}) for same-host A/B comparison..."
            if gh release download "$PREV_TAG" --pattern "solix-toolchain-x86_64-unknown-linux-gnu.tar.xz" --pattern "solix-toolchain-x86_64-unknown-linux-gnu.tar.gz" --dir "$RUNNER_TEMP/prev_release"; then
              ARCHIVE=$(find "$RUNNER_TEMP/prev_release" -maxdepth 1 -type f \( -name '*.tar.xz' -o -name '*.tar.gz' \) | head -n 1)
              if [ -n "$ARCHIVE" ]; then
                tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/prev_release"
                PREV_BIN=$(find "$RUNNER_TEMP/prev_release" -type f -name 'solix' | head -n 1 || true)
              fi
            fi
          fi

          if [ -n "$PREV_BIN" ] && [ -x "$PREV_BIN" ]; then
            python3 scripts/bench/solix_bench.py run --pin-cpu --solix-bin "$PREV_BIN" --solix-only --label "$PREV_TAG" --save-baseline staging-benchmarks/prev_baseline.json
            python3 scripts/bench/solix_bench.py run --pin-cpu --solix-bin target/release/solix --label "$CURRENT_TAG" --save-baseline staging-benchmarks/release_baseline.json
            python3 scripts/bench/solix_bench.py compare \
              --previous staging-benchmarks/prev_baseline.json \
              --current staging-benchmarks/release_baseline.json \
              --current-tag "$CURRENT_TAG" \
              --previous-tag "$PREV_TAG" \
              --same-host \
              --cross-language \
              --min-delta-ms 0.5 \
              --markdown-output staging-benchmarks/benchmark_comparison.md
          else
            echo "Previous Linux binary unavailable; running single-host baseline and historical comparison."
            python3 scripts/bench/solix_bench.py run --pin-cpu --solix-bin target/release/solix --label "$CURRENT_TAG" --save-baseline staging-benchmarks/release_baseline.json
            python3 scripts/bench/solix_bench.py compare \
              --current staging-benchmarks/release_baseline.json \
              --download-previous \
              --current-tag "$CURRENT_TAG" \
              --cross-language \
              --min-delta-ms 0.5 \
              --markdown-output staging-benchmarks/benchmark_comparison.md
          fi

      - name: Upload benchmark artifacts for release ingestion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-benchmarks
          path: staging-benchmarks/

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - prepare-release
      - plan
      - build-bundled-libs
      - build-vscode-extension
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Set up Rust, Cargo cache, and Python
        uses: ./.github/actions/solix-setup
        with:
          rust-targets: ${{ join(matrix.targets, ',') }}
          rust-cache-prefix-key: release-dist-${{ matrix.runner }}-${{ join(matrix.targets, '-') }}

      - name: Install dist
        if: runner.os != 'Windows'
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: eval "$INSTALL_DIST_CMD"

      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: Invoke-Expression $env:INSTALL_DIST_CMD

      - name: Set up Zig compiler
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.13.0"
          use-cache: false

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: pipx install cargo-zigbuild

      - name: Install musl-tools
        if: runner.os == 'Linux' && contains(matrix.targets, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux dependencies for bundled libraries
        if: runner.os == 'Linux' && !contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS dependencies for bundled libraries
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Install dist target packages
        if: runner.os != 'Windows'
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: eval "$PKG_INSTALL_CMD"

      - name: Install dist target packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PKG_INSTALL_CMD)) {
            Invoke-Expression $env:PKG_INSTALL_CMD
          }

      - name: Download universal cross-platform bundled packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

      - name: Stage non-colliding standalone bundled archives (Linux x86_64)
        if: contains(matrix.targets, 'x86_64-unknown-linux-gnu')
        shell: bash
        run: |
          mkdir -p target/distrib
          for dir in crates/solix-toolchain/assets/packages/*@*; do
            dir_name=$(basename "$dir")
            pkg_id="${dir_name%%@*}"
            for arc in "$dir"/*.slxp "$dir"/*.slxarc; do
              if [ -f "$arc" ]; then
                cp "$arc" "target/distrib/${pkg_id}.slxp"
              fi
            done
          done

      - name: Download bundled VS Code extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-vscode-extension
          path: crates/solix-toolchain/assets/vscode/

      - name: Download staged offline solix wiki documentation portal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/

      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          read -r -a dist_args_array <<< "$DIST_ARGS"
          dist build "$TAG_FLAG" --print=linkage --output-format=json "${dist_args_array[@]}" > dist-manifest.json
          echo "dist ran successfully"

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          mkdir -p "$(dirname "$BUILD_MANIFEST_NAME")"
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.slxp

  build-global-artifacts:
    name: Build Global Release Installers
    needs:
      - prepare-release
      - plan
      - build-local-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Ensure dist binary is executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build "$TAG_FLAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - plan
      - build-vscode-extension
      - build-bundled-libs
      - build-local-artifacts
      - build-global-artifacts
      - benchmark-release
    if: >-
      always()
      && needs.prepare-release.outputs.dry_run != 'true'
      && needs.prepare-release.result == 'success'
      && needs.build-bundled-libs.result == 'success'
      && needs.build-local-artifacts.result == 'success'
      && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success')
      && needs.build-vscode-extension.result == 'success'
      && needs.benchmark-release.result == 'success'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - name: Checkout master release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Ensure dist binary is executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist host "$TAG_FLAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Finalize GitHub Release notes and extra assets
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ needs.prepare-release.outputs.release_sha }}"
          TAG_NAME: "${{ needs.prepare-release.outputs.tag }}"
        run: |
          rm -f artifacts/*-dist-manifest.json
          : > "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/release_changelog.md ]; then
            if ! printf '%s\n' "$ANNOUNCEMENT_BODY" | grep -q "^## Release Notes"; then
              cat artifacts/release_changelog.md >> "$RUNNER_TEMP/notes.txt"
              printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            fi
            rm -f artifacts/release_changelog.md
          fi
          printf '%s\n' "$ANNOUNCEMENT_BODY" >> "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/benchmark_comparison.md ]; then
            printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            cat artifacts/benchmark_comparison.md >> "$RUNNER_TEMP/notes.txt"
            rm -f artifacts/benchmark_comparison.md
          fi
          mapfile -t release_files < <(find artifacts -maxdepth 1 -type f | sort)
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            if [ "${#release_files[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${release_files[@]}" --clobber
            fi
          else
            gh release create "$TAG_NAME" --target "$RELEASE_COMMIT" ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${release_files[@]}"
          fi

  sync-wiki:
    name: Mirror Versioned Docs to GitHub Wiki
    needs:
      - prepare-release
      - host
    if: needs.prepare-release.outputs.dry_run != 'true' && needs.host.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/solix-setup
        with:
          enable-rust: "false"
          enable-rust-cache: "false"

      - name: Stage and push read-only GitHub Wiki snapshot
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION_CLEAN="${RELEASE_TAG#v}"
          WIKI_DIR="$RUNNER_TEMP/github_wiki"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" clone "https://github.com/${REPO_SLUG}.wiki.git" "$WIKI_DIR"; then
            echo "GitHub Wiki git remote is not initialized yet; skipping wiki mirror."
            exit 0
          fi
          python3 scripts/docs/sync_github_wiki.py --output "$WIKI_DIR" --version "$VERSION_CLEAN"
          cd "$WIKI_DIR"
          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(wiki): sync documentation for Solix ${RELEASE_TAG}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD
          fi

  sync-dev:
    name: Sync master Release Commit Back to dev
    needs:
      - prepare-release
      - host
    if: needs.prepare-release.outputs.dry_run != 'true' && needs.host.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync master release commit back into dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git fetch origin dev master
          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "Branch dev already includes master commit."
            exit 0
          fi
          SYNC_BRANCH="chore/sync-master-to-dev-$(git rev-parse --short origin/master)"
          git checkout -B "$SYNC_BRANCH" origin/dev
          git merge --no-ff origin/master -X theirs -m "chore(release): sync master release state back to dev [skip ci]"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push -f origin "HEAD:${SYNC_BRANCH}"
          PR_URL=$(gh pr list --base dev --head "$SYNC_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base dev \
              --head "$SYNC_BRANCH" \
              --title "chore(release): sync master release state back to dev [skip ci]" \
              --body "Automated post-release sync bringing release metadata from \`master\` back into \`dev\` without re-running CI.")
          fi
          gh pr merge "$PR_URL" --merge --delete-branch --admin --subject "chore(release): sync master release state back to dev [skip ci]"
