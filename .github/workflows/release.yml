# Unified On-Demand Release Pipeline for Solix Toolchain & Workspace Crates
# Handles version selection, post-bump verification, dev -> master promotion,
# crates.io publishing, cross-platform installers, bundled packages,
# same-host release benchmarks, GitHub Releases, and Wiki/dev sync.

name: Release

run-name: "Release | ${{ inputs.version || inputs.bump || 'auto' }}${{ inputs.dry_run && ' (dry-run)' || '' }}"

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump strategy (auto from Conventional Commits, patch, minor, or major)"
        type: choice
        required: true
        default: "auto"
        options:
          - auto
          - patch
          - minor
          - major
      version:
        description: "Optional exact SemVer override X.Y.Z (overrides bump choice)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Validate full release workflow without pushing master, tagging, or publishing"
        type: boolean
        required: false
        default: false

jobs:
  prepare-release:
    name: Prepare Release, Verify Bump & Promote master
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.promote.outputs.release_sha }}
      tag: ${{ steps.bump.outputs.tag }}
      dist_tag: ${{ steps.bump.outputs.dist_tag }}
      version: ${{ steps.bump.outputs.version }}
      previous_tag: ${{ steps.bump.outputs.previous_tag }}
      dry_run: ${{ inputs.dry_run }}
    steps:
      - name: Checkout integration trunk (dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-linux

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Verify dev HEAD passed CI status checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          DEV_SHA=$(git rev-parse origin/dev)
          echo "Checking required CI checks on origin/dev (${DEV_SHA})..."
          CHECK_JSON=$(gh api --paginate "repos/${REPO_NAME}/commits/${DEV_SHA}/check-runs")
          python3 - "$CHECK_JSON" "$DRY_RUN" <<'PY'
          import json, sys

          payload = json.loads(sys.argv[1])
          dry_run = sys.argv[2].lower() == "true"
          required = [
              "Lint, Formatting & Documentation Gate",
              "Security & Supply-Chain Audit",
              "Test Matrix (ubuntu-latest)",
              "Test Matrix (macos-latest)",
              "Test Matrix (windows-latest)",
          ]
          runs = {}
          for item in payload.get("check_runs", []):
              name = item.get("name", "")
              if name not in runs or item.get("conclusion") == "success":
                  runs[name] = item

          missing_or_failed = []
          for req in required:
              check = runs.get(req)
              if not check or check.get("status") != "completed" or check.get("conclusion") != "success":
                  status_desc = check.get("conclusion") or check.get("status") if check else "missing"
                  missing_or_failed.append(f"{req} ({status_desc})")

          if missing_or_failed:
              msg = "origin/dev HEAD has incomplete/failing CI checks: " + ", ".join(missing_or_failed)
              if dry_run:
                  print(f"::warning::{msg}")
              else:
                  print(f"::error::{msg}", file=sys.stderr)
                  sys.exit(1)
          else:
              print("All required CI checks passed on origin/dev HEAD.")
          PY

      - id: bump
        name: Compute and apply version bump & changelog
        env:
          INPUT_BUMP: ${{ inputs.bump }}
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch origin master dev
          AHEAD_COUNT=$(git rev-list --count origin/master..origin/dev)
          if [ "$AHEAD_COUNT" -eq 0 ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::Integration branch dev has zero commits ahead of master." >&2
            exit 1
          fi

          OVERRIDE="$INPUT_BUMP"
          if [ -n "$INPUT_VERSION" ]; then
            OVERRIDE="$INPUT_VERSION"
          fi

          mkdir -p staging-release-notes
          python3 scripts/prepare_release_train.py \
            --base-ref origin/master \
            --head-ref origin/dev \
            --override "$OVERRIDE" \
            --write \
            --json-out "$RUNNER_TEMP/release_meta.json" \
            --changelog-out staging-release-notes/release_changelog.md

          CURRENT_VER=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/release_meta.json"))["current_version"])')
          NEXT_VER=$(python3 -c 'import json, os; print(json.load(open(os.environ["RUNNER_TEMP"] + "/release_meta.json"))["next_version"])')
          PREV_TAG="v${CURRENT_VER}"

          if [ "$DRY_RUN" = "true" ]; then
            DIST_TAG="v${CURRENT_VER}"
          else
            DIST_TAG="v${NEXT_VER}"
          fi

          {
            echo "current_version=${CURRENT_VER}"
            echo "version=${NEXT_VER}"
            echo "tag=v${NEXT_VER}"
            echo "dist_tag=${DIST_TAG}"
            echo "previous_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached bundled first-party libraries
        id: bundled-libs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/solix-toolchain/assets/packages
          key: solix-bundled-${{ runner.os }}-${{ hashFiles('libraries/**', 'crates/solix-common/src/**', 'crates/solix-compilation/src/**', 'crates/solix-toolchain/assets/scripts/**', 'scripts/build_default_libraries.py') }}

      - name: Install Linux system dependencies for post-bump check
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev gcc

      - name: Run post-bump workspace verification and packaging dry-run
        env:
          BUNDLED_CACHE_HIT: ${{ steps.bundled-libs-cache.outputs.cache-hit }}
        run: |
          python3 scripts/build_docs_site.py
          cargo build --bin solix
          if [ "$BUNDLED_CACHE_HIT" != "true" ]; then
            python3 scripts/build_default_libraries.py
          fi
          SOLIX_BIN="$(pwd)/target/debug/solix"
          export SOLIX_BIN
          cargo test --workspace --locked
          cargo package -p solix-common --locked --allow-dirty
          cargo package -p solix-ffi --locked --allow-dirty
          git checkout -- crates/solix-toolchain/assets/docs 2>/dev/null || true

      - id: promote # zizmor: ignore[use-trusted-publishing]
        name: Promote dev to master, tag release, and publish crates
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          NEXT_VER: ${{ steps.bump.outputs.version }}
          TAG_NAME: ${{ steps.bump.outputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            RELEASE_SHA=$(git rev-parse origin/dev)
            echo "DRY RUN: verified bump v${NEXT_VER}, post-bump workspace tests, and crate packaging."
            echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md crates/*/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): release ${NEXT_VER}"
          fi
          git tag -a "$TAG_NAME" -m "Solix ${TAG_NAME}"

          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" \
            push origin "HEAD:refs/heads/master" "refs/tags/${TAG_NAME}"

          RELEASE_SHA=$(git rev-parse HEAD)
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

          cargo publish -p solix-common --locked
          cargo publish -p solix-ffi --locked

          echo "Waiting for crates.io index to serve solix-common ${NEXT_VER}..."
          for attempt in $(seq 1 12); do
            echo "Checking crates.io index (attempt ${attempt}/12)..."
            if cargo search solix-common --limit 1 | grep -q "solix-common = \"${NEXT_VER}\""; then
              break
            fi
            sleep 10
          done

          cargo publish -p solix-compilation --locked
          cargo publish -p solix-runtime --locked

      - name: Upload release changelog artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-release-notes
          path: staging-release-notes/release_changelog.md

  build-vscode-extension:
    name: Build & Package VS Code Extension
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies and compile extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npx @vscode/vsce package --no-dependencies -o solix-language.vsix

      - name: Upload VS Code Extension for release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-vscode-extension
          path: editors/vscode/solix-language.vsix

  build-bundled-libs:
    name: Build Bundled Libraries (${{ matrix.target }})
    needs:
      - prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Restore cached bundled first-party libraries
        id: bundled-libs-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/solix-toolchain/assets/packages
          key: solix-bundled-release-${{ matrix.target }}-${{ hashFiles('libraries/**', 'crates/solix-common/src/**', 'crates/solix-compilation/src/**', 'crates/solix-toolchain/assets/scripts/**', 'scripts/build_default_libraries.py') }}

      - name: Install Rust toolchain
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-libs-${{ matrix.target }}

      - name: Set up Python
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS system dependencies
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Build host solix toolchain and native libraries for ${{ matrix.target }}
        if: steps.bundled-libs-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          SOLIX_TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          cargo build --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug

      - name: Upload bundled packages artifact (${{ matrix.target }})
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled-packages-${{ matrix.target }}
          path: crates/solix-toolchain/assets/packages/

  merge-universal-bundled-packages:
    name: Merge Universal Cross-Platform Bundled Libraries
    needs:
      - prepare-release
      - build-bundled-libs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Download per-target bundled packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: bundled-packages-*
          path: staging-bundled-libs

      - name: Merge per-platform libraries into universal cross-platform archives
        run: |
          python3 scripts/merge_bundled_packages.py \
            --input-dirs staging-bundled-libs/bundled-packages-* \
            --output-dir crates/solix-toolchain/assets/packages \
            --require-targets x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc,x86_64-apple-darwin,aarch64-apple-darwin

      - name: Upload universal cross-platform bundled packages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

  plan:
    name: Plan Multi-Platform Distribution
    needs:
      - prepare-release
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ needs.prepare-release.outputs.tag }}
      dist-tag: ${{ needs.prepare-release.outputs.dist_tag }}
      tag-flag: ${{ format('--tag={0}', needs.prepare-release.outputs.dist_tag) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Restore cached cargo-dist binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/dist
          key: cargo-dist-0.28.0-linux-x64

      - name: Install dist
        shell: bash
        run: |
          if [ ! -x ~/.cargo/bin/dist ]; then
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.28.0/cargo-dist-installer.sh | sh
          fi

      - name: Share dist binary with downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist

      - id: plan
        env:
          TAG_VALUE: ${{ needs.prepare-release.outputs.dist_tag }}
        run: |
          dist host --steps=create "--tag=${TAG_VALUE}" --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  benchmark-release:
    name: Run Same-Host Release Benchmarks
    needs:
      - prepare-release
      - plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-bench

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Build optimized Solix release binary and stage default libraries
        run: |
          cargo build --release --bin solix
          python3 scripts/build_default_libraries.py --profiles release,debug --solix-binary target/release/solix

      - name: Run same-host A/B benchmark suite against previous release binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.prepare-release.outputs.tag }}
          DRY_RUN: ${{ needs.prepare-release.outputs.dry_run }}
        run: |
          mkdir -p staging-benchmarks "$RUNNER_TEMP/prev_release"
          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName --jq "[.[] | select(.tagName != \"${CURRENT_TAG}\")][0].tagName // empty")
          PREV_BIN=""

          if [ -n "$PREV_TAG" ]; then
            echo "Downloading previous release Linux binary (${PREV_TAG}) for same-host A/B comparison..."
            if gh release download "$PREV_TAG" --pattern "solix-toolchain-x86_64-unknown-linux-gnu.tar.*" --dir "$RUNNER_TEMP/prev_release"; then
              ARCHIVE=$(find "$RUNNER_TEMP/prev_release" -maxdepth 1 -type f -name 'solix-toolchain-x86_64-unknown-linux-gnu.tar.*' | head -n 1)
              if [ -n "$ARCHIVE" ]; then
                tar -xf "$ARCHIVE" -C "$RUNNER_TEMP/prev_release"
                PREV_BIN=$(find "$RUNNER_TEMP/prev_release" -type f -name 'solix' | head -n 1 || true)
              fi
            fi
          fi

          if [ -n "$PREV_BIN" ] && [ -x "$PREV_BIN" ]; then
            python3 benchmarks/runner.py --pin-cpu --solix-bin "$PREV_BIN" --save-baseline staging-benchmarks/prev_baseline.json
            python3 benchmarks/runner.py --pin-cpu --solix-bin target/release/solix --save-baseline staging-benchmarks/release_baseline.json
            python3 benchmarks/compare_releases.py \
              --previous staging-benchmarks/prev_baseline.json \
              --current staging-benchmarks/release_baseline.json \
              --current-tag "$CURRENT_TAG" \
              --previous-tag "$PREV_TAG" \
              --same-host \
              --min-delta-ms 0.5 \
              --markdown-output staging-benchmarks/benchmark_comparison.md
          else
            echo "Previous Linux binary unavailable; running single-host baseline and historical comparison."
            python3 benchmarks/runner.py --pin-cpu --solix-bin target/release/solix --save-baseline staging-benchmarks/release_baseline.json
            python3 benchmarks/compare_releases.py \
              --current staging-benchmarks/release_baseline.json \
              --download-previous \
              --current-tag "$CURRENT_TAG" \
              --min-delta-ms 0.5 \
              --markdown-output staging-benchmarks/benchmark_comparison.md
          fi

      - name: Upload benchmark artifacts for release ingestion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-benchmarks
          path: staging-benchmarks/

  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - prepare-release
      - plan
      - merge-universal-bundled-packages
      - build-vscode-extension
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ join(matrix.targets, ',') }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: release-dist-${{ matrix.runner }}-${{ join(matrix.targets, '-') }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Install dist
        if: runner.os != 'Windows'
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: eval "$INSTALL_DIST_CMD"

      - name: Install dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          INSTALL_DIST_CMD: ${{ matrix.install_dist.run }}
        run: Invoke-Expression $env:INSTALL_DIST_CMD

      - name: Set up Zig compiler
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.13.0"
          use-cache: false

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux' && contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: pipx install cargo-zigbuild

      - name: Install musl-tools
        if: runner.os == 'Linux' && contains(matrix.targets, 'x86_64-unknown-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux dependencies for bundled libraries
        if: runner.os == 'Linux' && !contains(matrix.targets, 'aarch64-unknown-linux-gnu')
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install macOS dependencies for bundled libraries
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null 2>&1 || brew install cmake

      - name: Install dist target packages
        if: runner.os != 'Windows'
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: eval "$PKG_INSTALL_CMD"

      - name: Install dist target packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PKG_INSTALL_CMD: ${{ matrix.packages_install }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PKG_INSTALL_CMD)) {
            Invoke-Expression $env:PKG_INSTALL_CMD
          }

      - name: Download universal cross-platform bundled packages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: bundled-packages-universal
          path: crates/solix-toolchain/assets/packages/

      - name: Stage non-colliding standalone bundled archives (Linux x86_64)
        if: contains(matrix.targets, 'x86_64-unknown-linux-gnu')
        shell: bash
        run: |
          mkdir -p target/distrib
          for dir in crates/solix-toolchain/assets/packages/*@*; do
            dir_name=$(basename "$dir")
            pkg_id="${dir_name%%@*}"
            for arc in "$dir"/*.slxarc; do
              cp "$arc" "target/distrib/${pkg_id}.slxarc"
            done
          done

      - name: Download bundled VS Code extension artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artifacts-vscode-extension
          path: crates/solix-toolchain/assets/vscode/

      - name: Stage versioned offline solix wiki documentation portal
        shell: bash
        run: python3 scripts/build_docs_site.py

      - name: Build artifacts
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          read -r -a dist_args_array <<< "$DIST_ARGS"
          dist build "$TAG_FLAG" --print=linkage --output-format=json "${dist_args_array[@]}" > dist-manifest.json
          echo "dist ran successfully"

      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          mkdir -p "$(dirname "$BUILD_MANIFEST_NAME")"
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
            target/distrib/*.slxarc

  build-global-artifacts:
    name: Build Global Release Installers
    needs:
      - prepare-release
      - plan
      - build-local-artifacts
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Checkout branch for dry-run
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout master release commit
        if: (!inputs.dry_run)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Ensure dist binary is executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: cargo-dist
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist build "$TAG_FLAG" --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  host:
    name: Publish GitHub Release
    needs:
      - prepare-release
      - plan
      - build-vscode-extension
      - merge-universal-bundled-packages
      - build-local-artifacts
      - build-global-artifacts
      - benchmark-release
    if: >-
      always()
      && needs.prepare-release.outputs.dry_run != 'true'
      && needs.prepare-release.result == 'success'
      && needs.merge-universal-bundled-packages.result == 'success'
      && needs.build-local-artifacts.result == 'success'
      && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success')
      && needs.build-vscode-extension.result == 'success'
      && needs.benchmark-release.result == 'success'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-latest
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - name: Checkout master release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          submodules: recursive
          persist-credentials: false

      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/

      - name: Ensure dist binary is executable
        run: chmod +x ~/.cargo/bin/dist

      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true

      - id: host
        shell: bash
        env:
          TAG_FLAG: ${{ needs.plan.outputs.tag-flag }}
        run: |
          dist host "$TAG_FLAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json

      - name: Download GitHub Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Finalize GitHub Release notes and extra assets
        shell: bash
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ needs.prepare-release.outputs.release_sha }}"
          TAG_NAME: "${{ needs.prepare-release.outputs.tag }}"
        run: |
          rm -f artifacts/*-dist-manifest.json
          : > "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/release_changelog.md ]; then
            cat artifacts/release_changelog.md >> "$RUNNER_TEMP/notes.txt"
            printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            rm -f artifacts/release_changelog.md
          fi
          printf '%s\n' "$ANNOUNCEMENT_BODY" >> "$RUNNER_TEMP/notes.txt"
          if [ -f artifacts/benchmark_comparison.md ]; then
            printf '\n\n' >> "$RUNNER_TEMP/notes.txt"
            cat artifacts/benchmark_comparison.md >> "$RUNNER_TEMP/notes.txt"
            rm -f artifacts/benchmark_comparison.md
          fi
          mapfile -t release_files < <(find artifacts -maxdepth 1 -type f | sort)
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt"
            if [ "${#release_files[@]}" -gt 0 ]; then
              gh release upload "$TAG_NAME" "${release_files[@]}" --clobber
            fi
          else
            gh release create "$TAG_NAME" --target "$RELEASE_COMMIT" ${PRERELEASE_FLAG:+"$PRERELEASE_FLAG"} --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${release_files[@]}"
          fi

  sync-wiki:
    name: Mirror Versioned Docs to GitHub Wiki
    needs:
      - prepare-release
      - host
    if: needs.prepare-release.outputs.dry_run != 'true' && needs.host.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Stage and push read-only GitHub Wiki snapshot
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO_SLUG: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          VERSION_CLEAN="${RELEASE_TAG#v}"
          WIKI_DIR="$RUNNER_TEMP/github_wiki"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" clone "https://github.com/${REPO_SLUG}.wiki.git" "$WIKI_DIR"; then
            echo "GitHub Wiki git remote is not initialized yet; skipping wiki mirror."
            exit 0
          fi
          python3 scripts/sync_github_wiki.py --output "$WIKI_DIR" --version "$VERSION_CLEAN"
          cd "$WIKI_DIR"
          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "docs(wiki): sync documentation for Solix ${RELEASE_TAG}"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push origin HEAD
          fi

  sync-dev:
    name: Sync master Release Commit Back to dev
    needs:
      - prepare-release
      - host
    if: needs.prepare-release.outputs.dry_run != 'true' && needs.host.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync master release commit back into dev
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "solix-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git fetch origin dev master
          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "Branch dev already includes master commit."
            exit 0
          fi
          git checkout -B dev origin/dev
          git merge --no-ff origin/master -X theirs -m "chore(release): sync master release state back to dev"
          BASIC_AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC_AUTH}" push origin dev
