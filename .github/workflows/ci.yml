name: Solix Continuous Integration

run-name: "CI | ${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('{0} ({1})', github.ref_name, github.event_name) }}"

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  schedule:
    # Weekly Monday security re-scan for RustSec, workflows, and dependencies
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  pr-risk-audit:
    name: Sensitive-Path Risk Audit
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    outputs:
      has_codeql_changes: ${{ steps.collect.outputs.has_codeql_changes }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository for audit script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.repo.fork == false && github.sha || github.base_ref }}
          persist-credentials: false

      - name: Set up Python environment
        uses: ./.github/actions/solix-setup
        with:
          enable-rust: "false"
          enable-rust-cache: "false"
          enable-python: "true"

      - name: Collect changed PR files from GitHub API and run non-blocking audit
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/risk-audit"
          gh api --paginate "repos/${REPO_NAME}/pulls/${PR_NUMBER}/files" > "$RUNNER_TEMP/risk-audit/changed_files.json"
          python3 scripts/ci/pr_risk_audit.py \
            --files-json "$RUNNER_TEMP/risk-audit/changed_files.json" \
            --json-out "$RUNNER_TEMP/risk-audit/report.json" \
            --markdown-out "$RUNNER_TEMP/risk-audit/advisory.md" \
            --emit-annotations \
            --step-summary
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/risk-audit/pr_number.txt"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          files = json.loads((Path(os.environ["RUNNER_TEMP"]) / "risk-audit" / "changed_files.json").read_text(encoding="utf-8"))
          has_codeql_changes = any(
              entry.get("filename", "").startswith(".github/") or entry.get("filename", "").endswith(".py")
              for entry in files
          )
          print(f"has_codeql_changes={'true' if has_codeql_changes else 'false'}")
          PY

      - name: Upload risk audit artifact for discussion sync
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-risk-audit
          path: ${{ runner.temp }}/risk-audit/
          if-no-files-found: ignore
          retention-days: 1

      - name: Publish sticky sensitive-path notice and label for same-repo PRs
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          out_dir = Path(os.environ["RUNNER_TEMP"]) / "risk-audit"
          report = json.loads((out_dir / "report.json").read_text(encoding="utf-8"))
          advisory = (out_dir / "advisory.md").read_text(encoding="utf-8")
          repo = os.environ["REPO_NAME"]
          pr_num = os.environ["PR_NUMBER"]
          has_sensitive = bool(report.get("has_sensitive_changes"))

          comments_raw = subprocess.check_output(
              ["gh", "api", "--paginate", f"repos/{repo}/issues/{pr_num}/comments"],
              text=True,
          )
          comments = json.loads(comments_raw)
          existing_id = None
          for comment in comments:
              if "<!-- solix-pr-risk-audit -->" in (comment.get("body") or ""):
                  existing_id = comment["id"]
                  break

          if has_sensitive:
              for label in report.get("labels", []):
                  subprocess.run(
                      ["gh", "pr", "edit", pr_num, "--repo", repo, "--add-label", label],
                      check=False,
                  )
              if existing_id:
                  subprocess.run(
                      ["gh", "api", "--method", "PATCH", f"repos/{repo}/issues/comments/{existing_id}", "-f", f"body={advisory}"],
                      check=True,
                  )
              else:
                  subprocess.run(
                      ["gh", "api", "--method", "POST", f"repos/{repo}/issues/{pr_num}/comments", "-f", f"body={advisory}"],
                      check=True,
                  )
          else:
              subprocess.run(
                  ["gh", "pr", "edit", pr_num, "--repo", repo, "--remove-label", "sensitive"],
                  check=False,
              )
              if existing_id:
                  subprocess.run(
                      ["gh", "api", "--method", "DELETE", f"repos/{repo}/issues/comments/{existing_id}"],
                      check=False,
                  )
          PY

  security-audit:
    name: Security & Supply-Chain Audit
    if: >-
      (github.event_name == 'schedule')
      || (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache prebuilt CI security binaries
        id: ci-tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solix-ci-tools
          key: solix-ci-tools-linux-actionlint-1.7.12-cargo-audit-0.23.0-cargo-deny-0.19.0

      - name: Run actionlint with checksum-verified release binary
        run: |
          mkdir -p ~/.cache/solix-ci-tools/actionlint
          if [ ! -x ~/.cache/solix-ci-tools/actionlint/actionlint ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
              -o "$RUNNER_TEMP/actionlint.tar.gz"
            printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' \
              "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C ~/.cache/solix-ci-tools/actionlint actionlint
          fi
          ~/.cache/solix-ci-tools/actionlint/actionlint -color

      - name: Run zizmor GitHub Actions security scanner
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          annotations: true
          persona: regular

      - name: Run cargo-deny with checksum-verified cached binary
        run: |
          mkdir -p ~/.cache/solix-ci-tools/cargo-deny
          if [ ! -x ~/.cache/solix-ci-tools/cargo-deny/cargo-deny ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/cargo-deny-0.19.0-x86_64-unknown-linux-musl.tar.gz" \
              -o "$RUNNER_TEMP/cargo-deny.tar.gz"
            printf '0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f  %s\n' \
              "$RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C ~/.cache/solix-ci-tools/cargo-deny --strip-components=1 cargo-deny-0.19.0-x86_64-unknown-linux-musl/cargo-deny
          fi
          ~/.cache/solix-ci-tools/cargo-deny/cargo-deny check

      - name: Run cargo-audit RustSec vulnerability & unsoundness scanner
        run: |
          mkdir -p ~/.cache/solix-ci-tools/cargo-audit
          if [ ! -x ~/.cache/solix-ci-tools/cargo-audit/cargo-audit ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz" \
              -o "$RUNNER_TEMP/cargo-audit.tgz"
            printf 'b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  %s\n' \
              "$RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C ~/.cache/solix-ci-tools/cargo-audit --strip-components=1
          fi
          ~/.cache/solix-ci-tools/cargo-audit/cargo-audit audit --deny warnings --ignore RUSTSEC-2025-0141

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs:
      - pr-risk-audit
    if: >-
      (!cancelled())
      && (
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'pull_request'
          && github.base_ref == 'dev'
          && needs.pr-risk-audit.result == 'success'
          && needs.pr-risk-audit.outputs.has_codeql_changes == 'true'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"

  lint-and-docs:
    name: Lint, Formatting & Documentation Gate
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust, Cargo cache, Python, and Node.js
        uses: ./.github/actions/solix-setup
        with:
          rust-components: rustfmt, clippy
          rust-cache-shared-key: ci-linux
          enable-node: "true"

      - name: Enforce rustfmt formatting
        run: cargo fmt --all -- --check

      - name: Enforce Clippy lints across workspace targets
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Enforce strict production safety Clippy lints
        run: cargo clippy --workspace --exclude solix-tests --lib --bins --no-deps -- -D warnings -D clippy::unwrap_used -D clippy::expect_used -D clippy::panic -D clippy::min_ident_chars

      - name: Enforce GL-0011 and GL-0013 documentation sync
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF_INPUT: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_REF="origin/${BASE_REF_INPUT}"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE_REF="$BEFORE_SHA"
          else
            BASE_REF="origin/dev"
          fi
          python3 scripts/ci/doc_sync_check.py --base "$BASE_REF"
          python3 scripts/ci/doc_sync_check.py --all-docs

      - name: Verify documentation drift, link integrity & build offline solix wiki portal
        run: |
          python3 scripts/ci/verify_docs.py
          python3 scripts/ci/verify_doc_links.py
          python3 scripts/docs/build_docs_site.py

      - name: Run Python governance, wiki & security unit tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate, compile, and run static VS Code extension checks
        working-directory: editors/vscode
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          npm ci
          npm run compile
          npm run test:unit
          npm run test:contract
          npm run test:grammar
          npm run package
          test -f build/solix-language.vsix

      - name: Upload staged offline wiki docs for downstream jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/
          retention-days: 1

  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    needs:
      - lint-and-docs
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust, Cargo cache, Python, Node.js, and bundled package cache
        id: setup
        uses: ./.github/actions/solix-setup
        with:
          rust-cache-prefix-key: ci-test-${{ matrix.os }}
          enable-node: "true"
          restore-bundled-libs: "true"
          bundled-libs-key-prefix: solix-bundled

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v lua >/dev/null 2>&1 || brew install lua

      - name: Download staged offline solix wiki portal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/

      - name: Build solix toolchain binary
        run: cargo build --bin solix

      - name: Install cross runner
        if: runner.os == 'Linux' && steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          rustup component add rust-src
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi

      - name: Build and stage default first-party libraries
        if: runner.os == 'Linux' && steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: python3 scripts/release/build_default_libraries.py --target host

      - name: Run workspace tests (including embedded solix wiki and Zip-Slip checks)
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_BIN="$(pwd)/target/debug/solix.exe"
          else
            SOLIX_BIN="$(pwd)/target/debug/solix"
          fi
          export SOLIX_BIN
          cargo test --workspace --all-targets

      - name: Run C/C++ FFI SDK CTest suite (ffi/c)
        shell: bash
        run: |
          cmake -S ffi/c -B build-ffi-c -DSOLIX_FFI_BUILD_TESTS=ON
          cmake --build build-ffi-c --config Release
          ctest --test-dir build-ffi-c --build-config Release --output-on-failure
          rm -rf build-ffi-c

      - name: Verify embedded solix wiki standalone execution
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_EXE="./target/debug/solix.exe"
          else
            SOLIX_EXE="./target/debug/solix"
          fi
          ISOLATED_HOME="$RUNNER_TEMP/isolated_wiki_home"
          mkdir -p "$ISOLATED_HOME"
          SOLIX_HOME="$ISOLATED_HOME" SOLIX_FORCE_EMBEDDED_ASSETS=1 "$SOLIX_EXE" wiki --no-open --path
          SOLIX_HOME="$ISOLATED_HOME" SOLIX_FORCE_EMBEDDED_ASSETS=1 "$SOLIX_EXE" wiki --no-open --output "$RUNNER_TEMP/exported_wiki"
          test -f "$RUNNER_TEMP/exported_wiki/index.html"
          test -f "$RUNNER_TEMP/exported_wiki/assets/search_index.js"
          test ! -d "$RUNNER_TEMP/exported_wiki/internals"
          test ! -d "$RUNNER_TEMP/exported_wiki/guidelines"

      - name: Run benchmark correctness verification gate
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_BIN="$(pwd)/target/debug/solix.exe"
          else
            SOLIX_BIN="$(pwd)/target/debug/solix"
          fi
          export SOLIX_BIN
          python3 scripts/bench/solix_bench.py verify

      - name: List installed packages and verify example application compilation
        if: runner.os == 'Linux'
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_EXE="./target/debug/solix.exe"
          else
            SOLIX_EXE="./target/debug/solix"
          fi
          "$SOLIX_EXE" list
          "$SOLIX_EXE" build examples/breakout --profile debug
          "$SOLIX_EXE" build examples/breakout --profile release --target host
          "$SOLIX_EXE" build examples/breakout --profile test
          "$SOLIX_EXE" run examples/breakout/build/test/breakout.slxp

      - name: Run FFI C/C++/Rust matrix and dual-backend example suite
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_EXE="$(pwd)/target/debug/solix.exe"
          else
            SOLIX_EXE="$(pwd)/target/debug/solix"
          fi
          if [ "$CURRENT_OS" = "Linux" ]; then
            python3 scripts/tests/run_ffi_suite.py --solix-binary "$SOLIX_EXE"
          else
            python3 scripts/tests/run_ffi_suite.py --solix-binary "$SOLIX_EXE" --standalone-only
          fi

      - name: Run End-to-End Command & Option Lifecycle Matrix (GL-0009)
        shell: bash
        env:
          CURRENT_OS: ${{ runner.os }}
        run: |
          if [ "$CURRENT_OS" = "Windows" ]; then
            SOLIX_EXE="$(pwd)/target/debug/solix.exe"
          else
            SOLIX_EXE="$(pwd)/target/debug/solix"
          fi
          if [ "$CURRENT_OS" = "Linux" ]; then
            python3 scripts/tests/test_cli_lifecycle_matrix.py --solix-binary "$SOLIX_EXE"
          else
            python3 scripts/tests/test_cli_lifecycle_matrix.py --solix-binary "$SOLIX_EXE" --pure-solix-only
          fi

      - name: Run headless VS Code LSP & DAP JSON-RPC harness
        working-directory: editors/vscode
        shell: bash
        run: |
          npm ci
          npm run compile
          npm test

  coverage:
    name: Workspace Code Coverage Gate
    needs:
      - lint-and-docs
    if: >-
      (github.event_name == 'workflow_dispatch')
      || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Rust with llvm-tools, Cargo cache, Python, and bundled package cache
        id: setup
        uses: ./.github/actions/solix-setup
        with:
          rust-components: llvm-tools-preview
          rust-cache-prefix-key: ci-llvm-cov-linux
          restore-bundled-libs: "true"
          bundled-libs-key-prefix: solix-bundled

      - name: Cache prebuilt cargo-llvm-cov binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/solix-ci-tools/cargo-llvm-cov
          key: solix-ci-llvm-cov-0.9.1

      - name: Download staged offline solix wiki portal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/

      - name: Install Linux dependencies and cargo-llvm-cov
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev gcc
          mkdir -p ~/.cache/solix-ci-tools/cargo-llvm-cov
          if [ ! -x ~/.cache/solix-ci-tools/cargo-llvm-cov/cargo-llvm-cov ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
              -o "$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
            printf 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  %s\n' \
              "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/cargo-llvm-cov.tar.gz" -C ~/.cache/solix-ci-tools/cargo-llvm-cov cargo-llvm-cov
          fi

      - name: Install cross runner
        if: steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          rustup component add rust-src
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi

      - name: Build binary and stage bundled packages for coverage suite
        env:
          BUNDLED_CACHE_HIT: ${{ steps.setup.outputs.bundled-libs-cache-hit }}
        run: |
          cargo build --bin solix
          if [ "$BUNDLED_CACHE_HIT" != "true" ]; then
            python3 scripts/release/build_default_libraries.py --target host --solix-binary target/debug/solix
            cargo build --bin solix
          fi

      - name: Run cargo-llvm-cov coverage gate (>= 55% workspace lines)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          export PATH="$HOME/.cache/solix-ci-tools/cargo-llvm-cov:$PATH"
          SOLIX_BIN="$(pwd)/target/debug/solix"
          export SOLIX_BIN
          cargo llvm-cov --workspace --all-targets --ignore-filename-regex '(/rustc/|/tests/)' --fail-under-lines 55 --summary-only | tee "$RUNNER_TEMP/coverage_summary.txt"

          mkdir -p "$RUNNER_TEMP/pr-coverage"
          CHANGED_FILES=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin dev:origin/dev --depth=20 || git fetch origin dev || true
            CHANGED_FILES=$(git diff --name-only origin/dev...HEAD | tr '\n' ',' || true)
          fi

          python3 scripts/ci/render_coverage_summary.py \
            --input "$RUNNER_TEMP/coverage_summary.txt" \
            --output "$RUNNER_TEMP/pr-coverage/coverage.md" \
            --json-output "$RUNNER_TEMP/pr-coverage/coverage.json" \
            --changed-files "$CHANGED_FILES" \
            --step-summary

      - name: Stage coverage PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-coverage"
          printf '%s\n' "$PR_NUMBER" > "$RUNNER_TEMP/pr-coverage/pr_number.txt"

      - name: Upload coverage report artifact for discussion sync
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-coverage-report
          path: ${{ runner.temp }}/pr-coverage/
          if-no-files-found: ignore
          retention-days: 1

      - name: Post or update sticky PR coverage comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          coverage_file = Path(os.environ["RUNNER_TEMP"]) / "pr-coverage" / "coverage.md"
          if not coverage_file.is_file():
              raise SystemExit(0)
          comment_body = coverage_file.read_text(encoding="utf-8")
          repository_name = os.environ["REPO_NAME"]
          pull_request_number = os.environ["PR_NUMBER"]

          try:
              comments_raw = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{repository_name}/issues/{pull_request_number}/comments"],
                  text=True,
              )
              comments_payload = json.loads(comments_raw)
              existing_comment_identifier = None
              for current_comment in comments_payload:
                  if "<!-- solix-pr-coverage -->" in (current_comment.get("body") or ""):
                      existing_comment_identifier = current_comment["id"]
                      break

              if existing_comment_identifier:
                  subprocess.run(
                      ["gh", "api", "--method", "PATCH", f"repos/{repository_name}/issues/comments/{existing_comment_identifier}", "-f", f"body={comment_body}"],
                      check=True,
                  )
              else:
                  subprocess.run(
                      ["gh", "api", "--method", "POST", f"repos/{repository_name}/issues/{pull_request_number}/comments", "-f", f"body={comment_body}"],
                      check=True,
                  )
          except subprocess.CalledProcessError as called_process_error:
              print(f"[NOTICE] Unable to post coverage comment: {called_process_error}")
          PY

  pr-benchmark:
    name: PR Performance Benchmark (vs dev)
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    needs:
      - lint-and-docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Rust, Cargo cache, Python, and bundled package cache
        id: setup
        uses: ./.github/actions/solix-setup
        with:
          rust-cache-prefix-key: pr-bench
          restore-bundled-libs: "true"
          bundled-libs-key-prefix: solix-bundled-release

      - name: Resolve current origin/dev commit SHA
        id: dev-sha
        run: |
          git fetch origin dev:origin/dev --depth=20 || git fetch origin dev || true
          DEV_COMMIT=$(git rev-parse origin/dev)
          echo "sha=${DEV_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Cache origin/dev baseline release binary
        id: dev-bin-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dev-bench-bin
          key: solix-dev-bench-bin-${{ runner.os }}-${{ steps.dev-sha.outputs.sha }}

      - name: Download staged offline solix wiki portal
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: staged-offline-docs
          path: crates/solix-toolchain/assets/docs/

      - name: Install Linux benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev lua5.4 luajit gcc

      - name: Install cross runner
        if: steps.setup.outputs.bundled-libs-cache-hit != 'true'
        run: |
          rustup component add rust-src
          if ! command -v cross >/dev/null 2>&1; then
            curl -fsSL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar -xz -C /usr/local/bin || true
          fi

      - name: Build release Solix binary and stage bundled libraries
        env:
          BUNDLED_CACHE_HIT: ${{ steps.setup.outputs.bundled-libs-cache-hit }}
        run: |
          cargo build --release --bin solix
          if [ "$BUNDLED_CACHE_HIT" != "true" ]; then
            python3 scripts/release/build_default_libraries.py --profiles release --target host --solix-binary target/release/solix
            cargo build --release --bin solix
          fi

      - name: Benchmark PR head vs current dev branch on same host
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/pr-bench" "$RUNNER_TEMP/dev-bench-bin"

          # 1. Benchmark PR head
          python3 scripts/bench/solix_bench.py run \
            --pin-cpu \
            --warmup 2 \
            --iterations 5 \
            --solix-bin target/release/solix \
            --solix-only \
            --label "PR #${PR_NUMBER}" \
            --save-baseline "$RUNNER_TEMP/pr-bench/pr_baseline.json"

          # 2. Reuse cached dev binary or build dev binary sharing CARGO_TARGET_DIR
          DEV_BIN="$RUNNER_TEMP/dev-bench-bin/solix"
          if [ ! -x "$DEV_BIN" ]; then
            git worktree add "$RUNNER_TEMP/dev_worktree" origin/dev
            CARGO_TARGET_DIR="$(pwd)/target" cargo build --manifest-path "$RUNNER_TEMP/dev_worktree/Cargo.toml" --release --bin solix
            cp target/release/solix "$DEV_BIN"
            chmod +x "$DEV_BIN"
            git worktree remove --force "$RUNNER_TEMP/dev_worktree" || true
          fi

          python3 scripts/bench/solix_bench.py run \
            --pin-cpu \
            --warmup 2 \
            --iterations 5 \
            --solix-bin "$DEV_BIN" \
            --solix-only \
            --label "dev" \
            --save-baseline "$RUNNER_TEMP/pr-bench/dev_baseline.json"

          # 3. Compare without --cross-language (Solix workloads only)
          python3 scripts/bench/solix_bench.py compare \
            --previous "$RUNNER_TEMP/pr-bench/dev_baseline.json" \
            --current "$RUNNER_TEMP/pr-bench/pr_baseline.json" \
            --previous-tag "dev" \
            --current-tag "PR #${PR_NUMBER}" \
            --same-host \
            --min-delta-ms 0.5 \
            --markdown-output "$RUNNER_TEMP/pr-bench/report.md"

      - name: Publish benchmark report to Step Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pr-bench/report.md" ]; then
            cat "$RUNNER_TEMP/pr-bench/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage benchmark PR number
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/pr-bench"
          printf '%s\n' "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/pr-bench/pr_number.txt"

      - name: Upload benchmark report artifact for discussion sync
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-benchmark-report
          path: ${{ runner.temp }}/pr-bench/
          if-no-files-found: ignore
          retention-days: 1

      - name: Post or update sticky PR benchmark comment
        if: github.event.pull_request.head.repo.fork == false
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          report_markdown = (Path(os.environ["RUNNER_TEMP"]) / "pr-bench" / "report.md").read_text(encoding="utf-8")
          comment_body = f"<!-- solix-pr-benchmark -->\n## PR Benchmark Report\n\n{report_markdown}"
          repository_name = os.environ["REPO_NAME"]
          pull_request_number = os.environ["PR_NUMBER"]

          try:
              comments_raw = subprocess.check_output(
                  ["gh", "api", "--paginate", f"repos/{repository_name}/issues/{pull_request_number}/comments"],
                  text=True,
              )
              comments_payload = json.loads(comments_raw)
              existing_comment_identifier = None
              for current_comment in comments_payload:
                  if "<!-- solix-pr-benchmark -->" in (current_comment.get("body") or ""):
                      existing_comment_identifier = current_comment["id"]
                      break

              if existing_comment_identifier:
                  subprocess.run(
                      ["gh", "api", "--method", "PATCH", f"repos/{repository_name}/issues/comments/{existing_comment_identifier}", "-f", f"body={comment_body}"],
                      check=True,
                  )
              else:
                  subprocess.run(
                      ["gh", "api", "--method", "POST", f"repos/{repository_name}/issues/{pull_request_number}/comments", "-f", f"body={comment_body}"],
                      check=True,
                  )
          except subprocess.CalledProcessError as called_process_error:
              print(f"[NOTICE] Unable to post pull request comment: {called_process_error}")
          PY
