name: Continuous Integration & Verification

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  lint-and-docs:
    name: Lint, Formatting & Documentation Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify Rust code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy static analysis
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run documentation synchronization and quality gate
        run: python3 scripts/doc_sync_check.py

      - name: Verify documentation drift and link integrity
        run: python3 scripts/verify_docs.py

      - name: Validate VS Code extension manifest
        run: node -e "JSON.parse(require('fs').readFileSync('editors/vscode/package.json', 'utf8'))"

  test-matrix:
    name: Test Matrix (${{ matrix.os }})
    needs: lint-and-docs
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev

      - name: Install Zig compiler
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Build and stage default first-party libraries
        if: runner.os == 'Linux'
        run: python3 scripts/build_default_libraries.py

      - name: Build solix toolchain binary
        run: cargo build --bin solix

      - name: Run workspace tests
        run: cargo test --workspace --all-targets
        env:
          SOLIX_BIN: ${{ runner.os == 'Windows' && format('{0}/target/debug/solix.exe', github.workspace) || format('{0}/target/debug/solix', github.workspace) }}

      - name: Run benchmark correctness verification gate
        if: runner.os == 'Linux'
        run: python3 benchmarks/runner.py --verify

      - name: List installed packages
        if: runner.os == 'Linux'
        run: cargo run --bin solix -- list

      - name: Verify example application compilation
        if: runner.os == 'Linux'
        run: |
          cargo run --bin solix -- build examples/breakout --profile debug
          cargo run --bin solix -- build examples/breakout --profile release
