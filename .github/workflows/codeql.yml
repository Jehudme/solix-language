name: CodeQL Static Security Analysis

run-name: "CodeQL | ${{ github.event_name == 'pull_request' && format('PR #{0} ({1})', github.event.pull_request.number, github.head_ref) || format('{0} ({1})', github.ref_name, github.event_name) }}"

on:
  push:
    branches:
      - dev
      - master
    paths:
      - ".github/**"
      - "**/*.py"
  pull_request:
    branches:
      - dev
    paths:
      - ".github/**"
      - "**/*.py"
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
