version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "bincode"
        versions: [">= 2.0.0"]
    labels:
      - "dependencies"
      - "sensitive"
      - "P2"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "sensitive"
      - "P2"
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: "npm"
    directory: "/editors/vscode"
    target-branch: "dev"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "P2"
    commit-message:
      prefix: "chore(deps)"
