name: Feature Request
description: Propose a new language capability, standard library API, or tooling enhancement.
title: "[Feature]: "
labels: ["feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Motivation & Summary
      description: What workflow or use case does this unlock?
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: Proposed Syntax, API, or CLI UX
      description: Provide clear examples using descriptive multi-letter identifiers (`GL-0011`).
    validations:
      required: true
