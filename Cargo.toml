[workspace]
resolver = "2"
members = [
    "crates/solix-common",
    "crates/solix-compilation",
    "crates/solix-runtime",
    "crates/solix-toolchain",
    "crates/solix-lsp",
    "crates/solix-dbg",
    "crates/solix-tests",
]
exclude = [
    "crates/solix-toolchain/assets/templates/untitled-rust/natives/rust_bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Jehud Metellus"]

[workspace.dependencies]
# Internal workspace crates
solix-common = { path = "crates/solix-common" }
solix-compilation = { path = "crates/solix-compilation" }
solix-runtime = { path = "crates/solix-runtime" }
solix-toolchain = { path = "crates/solix-toolchain" }
solix-lsp = { path = "crates/solix-lsp" }

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI tooling
clap = { version = "4.5", features = ["derive"] }

# Serialization & Diagnostics
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
miette = { version = "7.4", features = ["fancy"] }

# Language Server Protocol & Async
tower-lsp = "0.20"
tokio = { version = "1.54.1", features = ["full"] }

# Compiler & Lexer utilities
compact_str = { version = "0.8", features = ["serde"] }
unicode-ident = "1.0"

# Testing utilities
tempfile = "3.13"

# Native loading & Archives
libloading = "0.8"
toml = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"