[workspace]
resolver = "2"
members = [
    "crates/solix-common",
    "crates/solix-compilation",
    "crates/solix-runtime",
    "crates/solix-toolchain",
    "crates/solix-lsp",
    "crates/solix-dap",
    "ffi/rust",
    "crates/solix-tests",
]
exclude = [
    "crates/solix-toolchain/assets/templates/untitled-rust/natives/rust_bridge",
]

[workspace.package]
version = "1.6.2"
edition = "2024"
license = "Apache-2.0"
authors = ["Jehud Metellus"]
description = "The Solix Programming Language Toolchain"
repository = "https://github.com/Jehudme/solix-language"
documentation = "https://github.com/Jehudme/solix-language/tree/master/docs"

[workspace.dependencies]
# Internal workspace crates
solix-common = { path = "crates/solix-common", version = "1.6.2" }
solix-compilation = { path = "crates/solix-compilation", version = "1.6.2" }
solix-runtime = { path = "crates/solix-runtime", version = "1.6.2" }
solix-lsp = { path = "crates/solix-lsp", version = "1.6.2" }
solix-dap = { path = "crates/solix-dap", version = "1.6.2" }

# Error handling & logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI tooling
clap = { version = "4.5", features = ["derive"] }

# Serialization & Diagnostics
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "2.2"
bincode = "1.3"
miette = { version = "7.4", features = ["fancy"] }

# Language Server Protocol & Async
tower-lsp = "0.20"
tokio = { version = "1.54.1", features = ["full"] }

# Compiler & Lexer utilities
compact_str = { version = "0.10", features = ["serde"] }
unicode-ident = "1.0"

# Testing utilities
tempfile = "3.13"

# Native loading & Archives
libloading = "0.9"
toml = "1.2"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[workspace.metadata.dist]
cargo-dist-version = "0.28.0"
ci = "github"
allow-dirty = ["ci"]
installers = ["shell", "powershell"]
github-custom-runners = { "aarch64-unknown-linux-gnu" = "ubuntu-latest", "x86_64-unknown-linux-gnu" = "ubuntu-latest", "x86_64-unknown-linux-musl" = "ubuntu-latest", "x86_64-pc-windows-msvc" = "windows-latest", "aarch64-apple-darwin" = "macos-latest", "x86_64-apple-darwin" = "macos-latest", "global" = "ubuntu-latest" }
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
include = [
    "crates/solix-toolchain/assets",
    "README.md",
    "LICENSE",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "thin"
