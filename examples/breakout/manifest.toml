[info]
name = "breakout"
version = "0.1.0"
description = "Modern neon Breakout showcase game built with Solix and Raylib"
license = "Apache-2.0"
authors = []

[entrypoints]
main = "BreakoutGame::main"
test = "TestRunner::test"

[build]
profile = "release"

[profile.default]
opt_level = 0
inline_threshold = 8
debug_symbols = true

[profile.debug]
inherits = "default"
opt_level = 0
debug_symbols = true

[profile.release]
inherits = "default"
opt_level = 3
inline_threshold = 16
debug_symbols = false

[dependencies]
raylib = { version = "5.5.0", profile = "release" }
