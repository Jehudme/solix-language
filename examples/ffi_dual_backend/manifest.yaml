configuration:
  name: ffi_dual_backend
  version: "1.0.1"
  description: Dual-backend CMake (C11/C++17) and Rust FFI feature matrix showcase and test suite
  license: Apache-2.0
  authors:
    - Solix Contributors

profiles:
  release:
    entrypoint: Main::main
    optimization_level: 3
    inline_threshold: 16
    debug_symbols: false
    static: true
    sources:
      - src
    platforms:
      - all
    natives:
      cmake_backend:
        profile: release

  cmake_backend:
    entrypoint: TestRunner::test
    optimization_level: 2
    inline_threshold: 8
    debug_symbols: true
    static: false
    sources:
      - src
      - tests
    platforms:
      - host
    natives:
      cmake_backend:
        profile: release

  rust_backend:
    entrypoint: TestRunner::test
    optimization_level: 2
    inline_threshold: 8
    debug_symbols: true
    static: false
    sources:
      - src
      - tests
    platforms:
      - host
    natives:
      rust_backend:
        profile: release
