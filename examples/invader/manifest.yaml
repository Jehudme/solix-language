configuration:
  name: invader
  version: "2.0.0"
  description: Cyber Neon Space Invaders Arcade Showcase built with Solix, Raylib and Solixlib
  license: Apache-2.0
  authors: []

profiles:
  release:
    entrypoint: InvaderGame::main
    optimization_level: 3
    inline_threshold: 16
    debug_symbols: false
    static: true
    sources:
      - src
    platforms:
      - all
    dependencies:
      raylib:
        version: "6.0.0"
        profile: release
      solix:
        version: "2.2.0"
        profile: release

  debug:
    entrypoint: InvaderGame::main
    optimization_level: 0
    inline_threshold: 8
    debug_symbols: true
    static: false
    sources:
      - src
    platforms:
      - host
    dependencies:
      raylib:
        version: "6.0.0"
        profile: release
      solix:
        version: "2.2.0"
        profile: release

  test:
    entrypoint: TestRunner::test
    optimization_level: 0
    inline_threshold: 8
    debug_symbols: true
    static: false
    sources:
      - src
      - tests
    platforms:
      - host
    dependencies:
      raylib:
        version: "6.0.0"
        profile: release
      solix:
        version: "2.2.0"
        profile: release
